name: Factory Propagate

# When the stamped standard changes on main, restamp every factory-stamped
# repo of this owner and open the update PR there directly: clone, run the
# mechanical stamp, commit on factory-update/<version>, push, open the PR.
# A repo the mechanical stamp cannot reconcile (locally modified stamped
# files, no marker block) falls back to the old route, an @claude issue
# asking the responder to run /factory-update. Nothing is merged
# automatically: a human still merges every PR.
#
# Requires the FACTORY_PROPAGATE_TOKEN secret: a fine-grained PAT with
# Contents: write, Pull requests: write, Workflows: write and Issues: write
# on this owner's repos (Workflows: write is what lets a propagated update
# carry the workflow files themselves; without it the push is rejected).
# Without the secret the workflow skips with a notice (safe default for
# forks that don't want propagation). The default GITHUB_TOKEN cannot be
# used: it is scoped to this repository only.
#
# Trust boundary: docs/SECURITY-MODEL.md (propagate row). Setup and the
# exact PAT scopes: docs/OPERATIONS.md "Enable automatic propagation".

on:
  push:
    branches: [main]
    paths:
      - 'plugins/factory/templates/**'
      - 'plugins/factory/.claude-plugin/plugin.json'
  workflow_dispatch: # re-run propagation manually (e.g. after setting the token)
    inputs:
      dry_run:
        description: 'Print the per-repo plan and write nothing'
        type: boolean
        default: false

concurrency:
  group: factory-propagate
  cancel-in-progress: true

jobs:
  propagate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history: the stamp compares each consumer's workflow files
          # against the template as of the version that repo was stamped from,
          # so a locally modified file is never mistaken for a stale one.
          fetch-depth: 0

      - name: Stamp consumer repos and open their update PRs
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PROPAGATE_TOKEN }}
          FACTORY_PROPAGATE_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 scripts/propagate.py
